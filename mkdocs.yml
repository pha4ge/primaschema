site_name: primaschema

theme:
  name: "material"

repo_url: https://github.com/pha4ge/primaschema

# griffe_ext.py and any stray __pycache__ live inside docs/, and mkdocs copies
# unrecognised files into the built site verbatim unless excluded.
exclude_docs: |
  griffe_ext.py
  __pycache__/

plugins:
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            extensions:
              - griffe_pydantic
              # - docs/griffe_ext.py:InjectValidatorDocs
  - cyclopts

markdown_extensions:
  - toc:
      toc_depth: 4
  - admonition

nav:
  - Home: index.md
  - Command Line Interface: cli.md
  - Usage Examples: usage_examples.md
  - API: api.md
  - Info Model: info_model.md
  - Index Model: index_model.md
